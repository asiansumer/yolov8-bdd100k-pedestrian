# YOLOv8l 训练超参数 (与论文一致: lr0=0.0005, batch=4)
# 模型越大, 显存/统一内存占用越高, 所以 batch 更小; 学习率也取得更保守 (论文设定)
model: yolov8l.pt
epochs: 30
imgsz: 640
batch: 4
optimizer: SGD
lr0: 0.0005
momentum: 0.937
weight_decay: 0.0005
nbs: 64                # "名义 batch": Ultralytics 会累积梯度直到凑够约 64 张图才更新一次参数,
                       # 所以 batch=4 时实际是每 16 个 batch 更新一次 (梯度累积), 这是面试常考点
close_mosaic: 10       # 最后 10 轮关闭 mosaic 增强。注意: 若总共只训 10 轮, mosaic 从第 0 轮就被关掉了!
patience: 50
seed: 0
deterministic: true
